<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interesses das semanas passadas — treco&etc</title><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono&family=Libre+Caslon+Display&display=swap" rel="stylesheet"><style>:root{--cream:#fff1c9;--yellow:#ffc515;--red:#f04424;--ink:#10100e}*{box-sizing:border-box}body{margin:0;background:var(--yellow);color:var(--ink)}a{color:inherit}
.weekly{padding:64px 5%;background:var(--yellow);color:var(--ink);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.weekly-header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:2px solid;padding-bottom:26px}

.weekly-intro{font:clamp(24px,2.8vw,38px)/1.1 "Libre Caslon Display",serif;margin:18px 0 0;max-width:650px}
.weekly time,.weekly small{font:14px/1.5 "DM Mono",monospace;display:block}.weekly time{white-space:nowrap}
.weekly-grid{display:grid;grid-template-columns:1.15fr .85fr 1fr;gap:32px 36px;padding:32px 0;align-items:start}
.weekly-item{min-width:0;padding-top:14px;border-top:1px solid var(--ink)}
.weekly-item h3{font:clamp(28px,3vw,42px)/1.05 "Libre Caslon Display",serif;margin:10px 0 14px}
.weekly-item p{font:16px/1.55 "DM Mono",monospace;margin:0}
.weekly-item img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;margin:0 0 18px;filter:grayscale(.15)}
.weekly-item:first-child{grid-row:span 2;border-top:0;padding:0}.weekly-item:nth-child(3){margin-top:42px}.weekly-item:nth-child(5){background:var(--red);padding:20px;border:0}.weekly-item:nth-child(6){grid-column:2 / 4;max-width:750px}
.weekly-item:nth-child(6) h3{font-size:clamp(30px,3.8vw,58px)}
.weekly-archive{display:inline-block;font:16px/1.5 "DM Mono",monospace;text-underline-offset:5px;margin-top:8px}.weekly a:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.weekly-archive-list{display:grid;gap:30px;margin-top:44px}.weekly-edition{border-top:2px solid;padding-top:24px}.weekly-edition summary{cursor:pointer;font:26px/1.3 "Libre Caslon Display",serif}.weekly-empty{font:22px/1.4 "Libre Caslon Display",serif;max-width:650px;margin:40px 0}
