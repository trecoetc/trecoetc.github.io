backend:
  name: turbo-github
  turbo_site_id: de0cbe0e-19bb-46f6-b0a9-d7ea30f81f82
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "artigos"
    label: "Arquivo aberto"
    label_singular: "Artigo"
    folder: "content/artigos"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "string" }
      - { label: "Número", name: "number", widget: "string", hint: "Ex.: 005" }
      - { label: "Resumo", name: "excerpt", widget: "text" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - { label: "Imagem de capa", name: "cover", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: "projetos"
    label: "Treco que já fizemos"
    label_singular: "Projeto"
    folder: "content/projetos"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Nome do projeto", name: "title", widget: "string" }
      - { label: "Cliente", name: "client", widget: "string", required: false }
      - { label: "Categoria", name: "category", widget: "string" }
      - { label: "Ano", name: "year", widget: "string" }
      - { label: "Descrição curta", name: "excerpt", widget: "text" }
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - { label: "Capa", name: "cover", widget: "image", required: false }
      - label: "Galeria"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Imagem", name: "image", widget: "image" }
      - { label: "Conteúdo / case", name: "body", widget: "markdown" }
  - name: "interesses"
    label: "Interesses da semana"
    label_singular: "Semana"
    folder: "content/interesses"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "Semana de", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - label: "Interesses"
        name: "items"
        widget: "list"
        fields:
          - { label: "Categoria", name: "category", widget: "string", hint: "Ouvindo, fuçando, pensando sobre… você escolhe." }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Comentário da Treco", name: "comment", widget: "text" }
          - { label: "Imagem", name: "image", widget: "image", required: false }
          - { label: "Descrição da imagem", name: "alt", widget: "string", required: false }
          - { label: "Crédito da imagem", name: "credit", widget: "string", required: false }
          - { label: "Link", name: "url", widget: "string", required: false }
