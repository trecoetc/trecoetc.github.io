name: Recover failed Pages publication

on:
  workflow_run:
    workflows: ["Deploy Treco&etc to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry only if this is still the latest site revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$RUN_SHA" ]; then
            gh run rerun "$RUN_ID" --failed --repo "$GH_REPO"
          else
            echo "A newer publication already contains these changes."
          fi
